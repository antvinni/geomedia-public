# Livermore (Zenodo 23424278, CC BY 4.0): 40 smartphone recordings, each with its annotated
# frequency-time curve (one harmonic, UTC). Detection only: discovery is scored against the curve,
# aligned on the clip's own guide image (no recorder position or WAV start time is published).
# A dev set: no threshold is tuned against it. Clips are ~68 s, so the template stage abstains:
# this measures the ridge stage. Media live in the kept-data folder (media:livermore/).

[[case]]
id = "N373DF_R06"
kind = "ridges"
media = "media:livermore/V_constant_H_constant/N373DF_R06/audio.wav"
truth_csv = "media:livermore/V_constant_H_constant/N373DF_R06/frequency_vs_time_used.csv"
truth_note = "V_constant_H_constant"

