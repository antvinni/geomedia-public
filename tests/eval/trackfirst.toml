# Track-first evaluation (docs/superpowers/specs/2026-11-06-track-first-design.md).
# Real cases get only the day as prior (`when`); the blind leg gets the narrow window it always
# had (`blind_when`). Every real case has a wrong-day twin: ADS-B from one week earlier, re-timed
# onto the recording's day — it must not locate (> 3 km off counts as confident wrong; within
# 1 km is reported as a route echo). Oyster Bay cases are in-sample (used in development).
# The held-out phone clip has its own private manifest, kept with its media (broadband pipeline, one run).
# Needs the ADS-B days (and their neighbours) fetched first: `geomedia preflight … --yes`.

