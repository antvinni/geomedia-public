# Simulator suite: `geomedia eval tests/eval/sim-suite.toml --out geomedia-out/eval-sim`.
# Paths are relative to this file. Truth defaults to each scenario's observer.
# The area centre is offset ~3 km from the truth so the answer is never the prior centre.

