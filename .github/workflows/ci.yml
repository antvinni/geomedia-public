name: CI

# Manual only for now. During heavy development the gate is the full local test run before
# every merge; hosted runners queued for long stretches (macOS capacity, then minutes), so
# this workflow is started by hand when wanted. To re-enable on every change, add back:
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are useless across CI runs and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: macos-latest
    # Hard cap: the whole run must finish within 10 minutes.
    timeout-minutes: 10
    steps:
      # Actions pinned by commit; both JavaScript actions run on Node 24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.99.1-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
